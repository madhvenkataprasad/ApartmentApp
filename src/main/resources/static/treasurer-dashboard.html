<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasurer Dashboard - Satya Hyma Residency</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Satya Hyma Residency</h1>
                <p class="user-role">Treasurer Dashboard</p>
            </div>
            <div class="header-right">
                <span id="username" class="username"></span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <nav class="dashboard-nav">
            <button class="nav-btn active" data-tab="collections">Collections</button>
            <button class="nav-btn" data-tab="expenses">Expenses</button>
            <button class="nav-btn" data-tab="reports">Reports</button>
            <button class="nav-btn" data-tab="announcements">Announcements</button>
            <button class="nav-btn" data-tab="complaints">Complaints</button>
            <button class="nav-btn" data-tab="create-expense">Add Expense</button>
            <button class="nav-btn" data-tab="create-announcement">Create Announcement</button>
            <button class="nav-btn" data-tab="generate-report">Generate Report</button>
        </nav>

        <main class="dashboard-content">
            <!-- Collections Tab -->
            <div id="collections" class="tab-content active">
                <h2>Monthly Collections</h2>
                <div class="filter-section">
                    <label for="collectionMonth">Month:</label>
                    <select id="collectionMonth">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <label for="collectionYear">Year:</label>
                    <input type="number" id="collectionYear" value="2024" min="2020" max="2030">
                    <button id="filterCollectionsBtn" class="btn btn-primary">Filter</button>
                </div>
                <div id="collectionsList" class="payments-list"></div>
            </div>

            <!-- Expenses Tab -->
            <div id="expenses" class="tab-content">
                <h2>Apartment Expenses</h2>
                <div class="filter-section">
                    <label for="expenseMonth">Month:</label>
                    <select id="expenseMonth">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <label for="expenseYear">Year:</label>
                    <input type="number" id="expenseYear" value="2024" min="2020" max="2030">
                    <button id="filterExpensesBtn" class="btn btn-primary">Filter</button>
                </div>
                <div id="expensesList" class="expenses-list"></div>
            </div>

            <!-- Reports Tab -->
            <div id="reports" class="tab-content">
                <h2>Monthly Financial Reports</h2>
                <div id="reportsList" class="reports-list"></div>
            </div>

            <!-- Announcements Tab -->
            <div id="announcements" class="tab-content">
                <h2>My Announcements</h2>
                <div id="announcementsList" class="announcements-list"></div>
            </div>

            <!-- Complaints Tab -->
            <div id="complaints" class="tab-content">
                <h2>All Complaints</h2>
                <div id="complaintsList" class="complaints-list"></div>
            </div>

            <!-- Add Expense Tab -->
            <div id="create-expense" class="tab-content">
                <h2>Add New Expense</h2>
                <form id="expenseForm" class="auth-form">
                    <div class="form-group">
                        <label for="expenseTitle">Title</label>
                        <input type="text" id="expenseTitle" name="title" required
                               placeholder="Enter expense title">
                    </div>

                    <div class="form-group">
                        <label for="expenseDescription">Description</label>
                        <textarea id="expenseDescription" name="description" required rows="3"
                                  placeholder="Enter expense description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="expenseAmount">Amount (₹)</label>
                        <input type="number" id="expenseAmount" name="amount" required
                               min="0" step="0.01" placeholder="Enter amount">
                    </div>

                    <div class="form-group">
                        <label for="expenseCategory">Category</label>
                        <select id="expenseCategory" name="category" required>
                            <option value="CLEANING">Cleaning</option>
                            <option value="PLUMBING">Plumbing</option>
                            <option value="ELECTRICITY">Electricity</option>
                            <option value="SECURITY">Security</option>
                            <option value="GARDENING">Gardening</option>
                            <option value="ELEVATOR">Elevator</option>
                            <option value="WATER">Water</option>
                            <option value="COMMON_AREA">Common Area</option>
                            <option value="REPAIRS">Repairs</option>
                            <option value="ADMINISTRATIVE">Administrative</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expenseMonthInput">Month</label>
                        <select id="expenseMonthInput" name="month" required>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expenseYearInput">Year</label>
                        <input type="number" id="expenseYearInput" name="year" required
                               value="2024" min="2020" max="2030">
                    </div>

                    <div class="form-group">
                        <label for="billNumber">Bill Number (Optional)</label>
                        <input type="text" id="billNumber" name="billNumber"
                               placeholder="Enter bill number">
                    </div>

                    <div class="form-group">
                        <label for="vendorName">Vendor Name (Optional)</label>
                        <input type="text" id="vendorName" name="vendorName"
                               placeholder="Enter vendor name">
                    </div>

                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </div>

            <!-- Generate Report Tab -->
            <div id="generate-report" class="tab-content">
                <h2>Generate Monthly Report</h2>
                <form id="reportForm" class="auth-form">
                    <div class="form-group">
                        <label for="reportMonth">Month</label>
                        <select id="reportMonth" name="month" required>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reportYear">Year</label>
                        <input type="number" id="reportYear" name="year" required
                               value="2024" min="2020" max="2030">
                    </div>

                    <button type="submit" class="btn btn-primary">Generate Report</button>
                </form>

                <div id="generatedReport" class="report-preview"></div>
            </div>

            <!-- Create Announcement Tab -->
            <div id="create-announcement" class="tab-content">
                <h2>Create New Announcement</h2>
                <form id="announcementForm" class="auth-form">
                    <div class="form-group">
                        <label for="announcementTitle">Title</label>
                        <input type="text" id="announcementTitle" name="title" required
                               placeholder="Enter announcement title">
                    </div>

                    <div class="form-group">
                        <label for="announcementContent">Content</label>
                        <textarea id="announcementContent" name="content" required rows="5"
                                  placeholder="Enter announcement content"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="announcementType">Type</label>
                        <select id="announcementType" name="type" required>
                            <option value="GENERAL">General</option>
                            <option value="WATER_SUPPLY">Water Supply</option>
                            <option value="ELECTRICITY">Electricity</option>
                            <option value="CLEANING">Cleaning</option>
                            <option value="SECURITY">Security</option>
                            <option value="PARKING">Parking</option>
                            <option value="MAINTENANCE_REMINDER">Maintenance Reminder</option>
                            <option value="FINANCIAL">Financial Update</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Publish Announcement</button>
                </form>
            </div>
        </main>
    </div>

    <div id="message" class="message"></div>

    <script src="js/treasurer-dashboard.js"></script>
</body>
</html>
