<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Satya Hyma Residency</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Satya Hyma Residency</h1>
                <p id="userRole" class="user-role"></p>
            </div>
            <div class="header-right">
                <span id="username" class="username"></span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <nav class="dashboard-nav">
            <button class="nav-btn active" data-tab="announcements">Announcements</button>
            <button class="nav-btn" data-tab="complaints">Complaints</button>
            <button class="nav-btn" data-tab="payments">Payments</button>
            <button class="nav-btn" data-tab="expenses">Expenses</button>
            <button class="nav-btn" data-tab="reports">Reports</button>
            <button class="nav-btn" data-tab="notifications">
                Notifications
                <span id="notificationBadge" class="badge"></span>
            </button>
        </nav>

        <main class="dashboard-content">
            <!-- Announcements Tab -->
            <div id="announcements" class="tab-content active">
                <h2>Latest Announcements</h2>
                <div id="announcementsList" class="announcements-list"></div>
            </div>

            <!-- Complaints Tab -->
            <div id="complaints" class="tab-content">
                <h2>My Complaints</h2>
                <div class="complaint-actions">
                    <button id="addComplaintBtn" class="btn btn-primary">File New Complaint</button>
                </div>
                <div id="complaintsList" class="complaints-list"></div>
            </div>

            <!-- Payments Tab -->
            <div id="payments" class="tab-content">
                <h2>My Payments</h2>
                <div class="payment-actions">
                    <button id="makePaymentBtn" class="btn btn-primary">Make Payment</button>
                </div>
                <div id="paymentsList" class="payments-list"></div>
            </div>

            <!-- Expenses Tab -->
            <div id="expenses" class="tab-content">
                <h2>Apartment Expenses</h2>
                <div id="expensesList" class="expenses-list"></div>
            </div>

            <!-- Reports Tab -->
            <div id="reports" class="tab-content">
                <h2>Monthly Financial Reports</h2>
                <div id="reportsList" class="reports-list"></div>
            </div>

            <!-- Notifications Tab -->
            <div id="notifications" class="tab-content">
                <h2>Notifications</h2>
                <div id="notificationsList" class="notifications-list"></div>
            </div>
        </main>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Make Payment</h2>
                <button class="close-btn">&times;</button>
            </div>
            <form id="paymentForm" class="modal-form">
                <div class="form-group">
                    <label for="paymentAmount">Amount (₹)</label>
                    <input type="number" id="paymentAmount" name="amount" required
                           value="1500" min="1" step="0.01">
                </div>
                <div class="form-group">
                    <label for="paymentMonth">Month</label>
                    <select id="paymentMonth" name="month" required>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="paymentYear">Year</label>
                    <input type="number" id="paymentYear" name="year" required
                           value="2024" min="2020" max="2030">
                </div>
                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod" name="paymentMethod" required>
                        <option value="RAZORPAY">Razorpay (Online)</option>
                        <option value="UPI">UPI (QR Code)</option>
                        <option value="CASH">Cash (Manual)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="paymentNotes">Notes (Optional)</label>
                    <textarea id="paymentNotes" name="notes" rows="3"
                              placeholder="Any additional notes"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Proceed to Pay</button>
            </form>
        </div>
    </div>

    <!-- Complaint Modal -->
    <div id="complaintModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>File New Complaint</h2>
                <button class="close-btn">&times;</button>
            </div>
            <form id="complaintForm" class="modal-form">
                <div class="form-group">
                    <label for="complaintTitle">Title</label>
                    <input type="text" id="complaintTitle" name="title" required
                           placeholder="Brief title of the complaint">
                </div>
                <div class="form-group">
                    <label for="complaintDescription">Description</label>
                    <textarea id="complaintDescription" name="description" required rows="5"
                              placeholder="Detailed description of the issue"></textarea>
                </div>
                <div class="form-group">
                    <label for="complaintCategory">Category</label>
                    <select id="complaintCategory" name="category" required>
                        <option value="WATER_SUPPLY">Water Supply</option>
                        <option value="ELECTRICITY">Electricity</option>
                        <option value="CLEANING">Cleaning</option>
                        <option value="SECURITY">Security</option>
                        <option value="PARKING">Parking</option>
                        <option value="NOISE">Noise</option>
                        <option value="MAINTENANCE">Maintenance</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Submit Complaint</button>
            </form>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script src="js/dashboard.js"></script>
</body>
</html>
