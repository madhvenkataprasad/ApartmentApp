
# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=apartment

# SQL Script Initialization
spring.sql.init.mode=never

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Application Settings
app.upload.dir=uploads
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Brevo Email API
brevo.api-key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Satya Hyma Residency

# Session Configuration
server.servlet.session.timeout=30m

# Security Headers
security.headers.content-security-policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'
security.headers.frame-options=DENY
security.headers.xss-protection=1; mode=block
security.headers.content-type-options=nosniff
security.headers.strict-transport-security=max-age=31536000; includeSubDomains

# Application Security Salts
app.apartment.secret.salt=${APARTMENT_SECRET_SALT}
app.treasurer.key.salt=${TREASURER_KEY_SALT}

# Razorpay Configuration
app.payment.razorpay.key_id=${RAZORPAY_KEY_ID}
app.payment.razorpay.key_secret=${RAZORPAY_KEY_SECRET}
